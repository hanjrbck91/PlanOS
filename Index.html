<!doctype html>
<html><head><meta charset="utf-8"><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{
  --bg:#141310; --ink:#ece7d9; --muted:#9c968676; --muted2:#a9a290;
  --line:#3a362d; --line2:#4a453a;
  --cream:#ece7d9; --creamink:#1c1a15;
  --terra:#c06544; --terraink:#1a0f0a;
  --brown:#5f4a39; --olive:#8a9256;
  --panel:#1c1b16;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:520px;margin:0 auto;padding:20px 14px 40px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:10px}
.brand{font-family:var(--mono);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--muted2);margin-top:7px}
.hd-right{text-align:right;font-family:var(--mono)}
.hd-date{font-size:13px;letter-spacing:.04em;color:var(--ink)}
.hd-note{font-size:10.5px;color:var(--muted2);margin-top:6px;line-height:1.5}

/* grid */
.grid{display:grid;grid-template-columns:1fr;gap:12px}

/* card base */
.card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel)}
.card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card .label{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.count{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.04em}

/* hero today */
.today{background:var(--terra);color:var(--terraink);border-color:#00000033}
.today .label,.today .count{color:var(--terraink)}
.today .muted{color:#1a0f0a99}

/* tomorrow */
.tomorrow{background:var(--cream);color:var(--creamink);border-color:#00000022}
.tomorrow .label,.tomorrow .count{color:var(--creamink)}
.tomorrow .muted{color:#1c1a1599}

/* reflection */
.reflect{background:var(--brown);color:var(--cream)}
.reflect .muted{color:#ece7d9aa}

/* plan rows */
.plans{display:flex;flex-direction:column}
.plan{display:grid;grid-template-columns:22px 34px 1fr auto;align-items:center;gap:8px;padding:11px 0;border-top:1px solid currentColor}
.plan:first-child{border-top:0;padding-top:2px}
.today .plan,.tomorrow .plan{border-color:#00000022}
.plan.dragging{opacity:.6}
.plan.drop-target{border-top:2px solid var(--olive)}
.drag{cursor:grab;opacity:.4;font-size:15px;line-height:1;text-align:center;font-family:var(--mono);touch-action:none;user-select:none;-webkit-user-select:none;padding:6px 0}
.drag:active{cursor:grabbing;opacity:.8}
.move{border:0;background:none;color:inherit;opacity:.5;cursor:pointer;font-size:15px;line-height:1;padding:4px 5px;font-family:var(--mono)}
.move:active{opacity:1}
.actions{display:flex;align-items:center;gap:2px}
.status{width:32px;height:32px;min-width:32px;border:1.5px solid currentColor;border-radius:9px;background:transparent;color:inherit;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;font-family:var(--mono);opacity:.9}
.status:active{transform:translateY(1px)}
.status.done{background:var(--terraink);color:var(--cream);border-color:var(--terraink)}
.tomorrow .status.done,.today .status.done{background:currentColor}
.today .status.done{color:var(--terra);background:var(--terraink)}
.tomorrow .status.done{color:var(--cream);background:var(--creamink)}
.status.partial{opacity:1}
.status.skipped{opacity:.45}
.status.moved{border-style:dashed}
.ptext{min-width:0}
.pname{font-size:15.5px;line-height:1.3;cursor:pointer;word-break:break-word}
.pname.strike{text-decoration:line-through;opacity:.55}
.pstat{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-top:3px}
.del{border:0;background:none;color:inherit;opacity:.5;cursor:pointer;font-size:20px;line-height:1;padding:4px 6px;font-family:var(--mono)}
.del:active{opacity:1}
.empty{font-family:var(--mono);font-size:12px;letter-spacing:.04em;opacity:.6;padding:6px 0}

/* add row */
.add{display:flex;gap:8px;margin-top:12px}
.input{flex:1;min-width:0;border:1.5px solid var(--line2);border-radius:10px;background:#00000026;color:inherit;padding:12px 13px;font:inherit;font-size:15px}
.today .input,.tomorrow .input{background:#00000014;border-color:#00000033}
.input::placeholder{color:currentColor;opacity:.5}
.input:focus{outline:2px solid var(--olive);outline-offset:1px}
.addbtn{min-width:48px;border:1.5px solid currentColor;border-radius:10px;background:var(--terraink);color:var(--cream);font-size:22px;cursor:pointer;font-family:var(--mono);line-height:1}
.tomorrow .addbtn{background:var(--creamink);color:var(--cream)}
.reflect .addbtn{background:var(--terra);color:var(--cream);border-color:var(--terra)}
.addbtn:active{transform:translateY(1px)}

/* reflection textarea */
.rarea{width:100%;min-height:120px;resize:vertical;border:1.5px solid #00000033;border-radius:10px;background:#00000022;color:inherit;padding:12px 13px;font:inherit;font-size:15px;line-height:1.4}
.rarea::placeholder{color:currentColor;opacity:.5}
.rarea:focus{outline:2px solid var(--olive);outline-offset:1px}
.btn{margin-top:10px;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:10px;padding:11px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;font-weight:700}
.reflect .btn{background:var(--cream);color:var(--brown);border-color:var(--cream)}
.btn:active{transform:translateY(1px)}

/* utility tiles row */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--panel);cursor:pointer;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column;gap:8px}
.tile:active{transform:translateY(1px)}
.tile .tl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.tile .ts{font-size:12px;color:var(--muted2);line-height:1.4}
.tile.review{border-color:var(--line2)}

/* review panel */
#review{grid-column:1/-1}
.rev-block+.rev-block{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
.rev-range{font-family:var(--mono);font-size:12px;color:var(--muted2);margin-bottom:12px}
.counts{display:flex;flex-wrap:wrap;gap:12px 18px;margin-bottom:14px}
.counts>div{min-width:52px}
.counts b{display:block;font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:-.02em}
.counts span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.rev-block .rarea{border-color:var(--line2);background:#00000026}

/* reflection / review history (each note individually collapsible, client-side) */
.notes{margin-top:16px}
.notes-h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
details.note{border-top:1px solid #ffffff1f;padding:0}
.reflect details.note{border-color:#ffffff2b}
details.note:first-of-type{border-top:0}
details.note>summary{list-style:none;cursor:pointer;padding:10px 0;-webkit-tap-highlight-color:transparent}
details.note>summary::-webkit-details-marker{display:none}
.note-hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.note-t{font-family:var(--mono);font-size:10px;letter-spacing:.08em;opacity:.6}
.note .chev{font-size:12px;opacity:.55;transition:transform .15s;line-height:1}
details.note[open] .note .chev,details.note[open] .chev{transform:rotate(90deg)}
.note-prev{font-size:14px;line-height:1.4;opacity:.65;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.note[open] .note-prev{display:none}
.note-full{font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;padding:2px 0 10px}

/* sync indicator */
.sync{display:none;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);margin-top:6px}
body.busy .sync{display:block}

/* collapsible sections */
details.card{padding:0}
details.card>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;-webkit-tap-highlight-color:transparent}
details.card>summary::-webkit-details-marker{display:none}
.s-right{display:flex;align-items:center;gap:10px}
.chev{font-size:13px;opacity:.7;transition:transform .15s;line-height:1}
details[open]>summary .chev{transform:rotate(90deg)}
.sec-body{padding:0 16px 16px}
.sec-body .add{margin-top:0}

.hidden{display:none}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--olive);color:#14130f;font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:9}
#toast.show{opacity:1}

/* desktop */
@media(min-width:760px){
  .app{max-width:900px;padding:28px 24px 56px}
  .brand{font-size:36px}
  .grid{grid-template-columns:1fr 1fr;align-items:start}
  .today{grid-column:1/-1}
}
</style></head>
<body><main class="app">
  <div class="top">
    <div><div class="brand">PlanOS</div><div class="tag">PLAN · EXECUTE · REFLECT</div></div>
    <div class="hd-right"><div id="hdDate" class="hd-date"></div><div class="hd-note">Keep it short.<br>Get back to life.</div><div id="sync" class="sync">Syncing…</div></div>
  </div>

  <div class="grid">
    <section class="card today">
      <div class="head"><span class="label">Today</span><span id="todayCount" class="count"></span></div>
      <div id="todayDate" class="pstat" style="opacity:.55;margin:-6px 0 12px"></div>
      <div id="todayPlans" class="plans"></div>
      <div class="add"><input id="todayInput" class="input" placeholder="Add a plan…" onkeydown="if(event.key==='Enter')add('today')"><button class="addbtn" onclick="add('today')" aria-label="Add today plan">+</button></div>
    </section>

    <details class="card tomorrow">
      <summary><span>Tomorrow</span><span class="s-right"><span id="tomorrowCount" class="count"></span><span class="chev">▸</span></span></summary>
      <div class="sec-body">
        <div id="tomorrowDate" class="pstat" style="opacity:.55;margin:0 0 12px"></div>
        <div id="tomorrowPlans" class="plans"></div>
        <div class="add" style="margin-top:12px"><input id="tomorrowInput" class="input" placeholder="Prepare tomorrow…" onkeydown="if(event.key==='Enter')add('tomorrow')"><button class="addbtn" onclick="add('tomorrow')" aria-label="Add tomorrow plan">+</button></div>
      </div>
    </details>

    <details class="card reflect">
      <summary><span>Reflection</span><span class="chev">▸</span></summary>
      <div class="sec-body">
        <p class="muted" style="margin:0 0 10px;font-size:13px;line-height:1.45">What happened? What worked? What didn't? What should change tomorrow?</p>
        <textarea id="reflection" class="rarea" placeholder="Write a reflection…"></textarea>
        <button class="btn" onclick="saveReflection()">Save reflection</button>
        <div id="todayNotes" class="notes"></div>
      </div>
    </details>

    <details id="review" class="card">
      <summary><span>Review</span><span class="chev">▸</span></summary>
      <div class="sec-body">
        <div class="rev-block">
          <div class="head"><span class="label">This week</span></div>
          <div id="weekRange" class="rev-range"></div>
          <div id="weekCounts" class="counts"></div>
          <textarea id="weekReflection" class="rarea" placeholder="Weekly reflection — what worked, what was unrealistic, what changes next week?"></textarea>
          <button class="btn" style="background:var(--olive);color:#14130f;border-color:var(--olive)" onclick="saveWeekly()">Save weekly</button>
          <div id="weekNotes" class="notes"></div>
        </div>
        <div class="rev-block">
          <div class="head"><span class="label">This month</span></div>
          <div id="monthLabel" class="rev-range"></div>
          <div id="monthCounts" class="counts"></div>
          <textarea id="monthReflection" class="rarea" placeholder="Monthly reflection — patterns, recurring problems, recurring successes?"></textarea>
          <button class="btn" style="background:var(--olive);color:#14130f;border-color:var(--olive)" onclick="saveMonthly()">Save monthly</button>
          <div id="monthNotes" class="notes"></div>
        </div>
      </div>
    </details>

    <details class="card export">
      <summary><span>Export</span><span class="chev">▸</span></summary>
      <div class="sec-body">
        <p class="muted" style="margin:0 0 12px;font-size:13px;color:var(--muted2)">CSV. Your data, your insights.</p>
        <button class="btn" onclick="exportData()">Export CSV</button>
      </div>
    </details>
  </div>
</main>
<div id="toast"></div>
<script>
let state, week, month, weekData, monthData, reviewLoaded=false;

// --- server-call plumbing: one request per action, with a lightweight busy state ---
let inflight=0;
function setBusy(on){inflight+=on?1:-1;if(inflight<0)inflight=0;document.body.classList.toggle('busy',inflight>0)}
function fin(fn){return function(x){setBusy(false);if(fn)fn(x)}}
function err(e){toast(e&&e.message?e.message:String(e))}

// One RPC on initial load. Mutations do NOT call this again — they patch local state.
function load(){setBusy(true);google.script.run.withSuccessHandler(fin(render)).withFailureHandler(fin(err)).getBootstrap()}

function render(s){
  state=s;
  document.getElementById('hdDate').textContent=hdDate(s.today);
  document.getElementById('todayDate').textContent=pretty(s.today);
  document.getElementById('tomorrowDate').textContent=pretty(s.tomorrow);
  renderPlans('todayPlans',s.todayPlans);
  renderPlans('tomorrowPlans',s.tomorrowPlans);
  updateCounts();
  renderNotes('todayNotes', s.reflections, 'time', "Today's notes");
}
function updateCounts(){
  document.getElementById('todayCount').textContent=doneCount(state.todayPlans);
  document.getElementById('tomorrowCount').textContent=String(state.tomorrowPlans.length);
}
function doneCount(plans){const d=plans.filter(p=>p.status==='done').length;return d+'/'+plans.length}
function hdDate(k){const d=new Date(k+'T00:00:00');return d.toLocaleDateString(undefined,{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}
function pretty(k){const d=new Date(k+'T00:00:00');return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
function renderPlans(id,plans){
  const which=id.replace('Plans','');
  document.getElementById(id).innerHTML=plans.map(p=>
    `<div class="plan" data-id="${p.id}">`+
    `<div class="drag" title="Drag to reorder" aria-label="drag to reorder">⋮</div>`+
    `<button class="status ${p.status}" onclick="cycle('${p.id}','${p.status}')" aria-label="status ${p.status}">${icon(p.status)}</button>`+
    `<div class="ptext"><div class="pname ${p.status==='skipped'?'strike':''}" onclick="edit('${p.id}')">${escapeHtml(p.plan)}</div><div class="pstat">${p.status}</div></div>`+
    `<div class="actions"><button class="move" onclick="moveDay('${p.id}')" aria-label="move to other day">⇄</button><button class="del" onclick="removePlan('${p.id}')" aria-label="delete">×</button></div>`+
    `</div>`
  ).join('')||'<div class="empty">Nothing planned yet.</div>';
  makeSortable(id,which);
}
function icon(s){return {planned:'○',done:'✓',partial:'◐',skipped:'–',moved:'→'}[s]||'○'}
function isTmp(id){return String(id).indexOf('tmp_')===0}

// Background persistence: UI is already updated optimistically. Shows the "Syncing…"
// indicator while in flight; on failure runs onFail (to revert) and warns. Never blocks.
function persist(fn,args,onFail){
  setBusy(true);
  const runner=google.script.run
    .withSuccessHandler(function(){setBusy(false)})
    .withFailureHandler(function(e){setBusy(false);toast('Sync failed — '+((e&&e.message)?e.message:'kept locally')+'.');if(onFail)onFail(e)});
  runner[fn].apply(runner,args);
}

// Touch/pointer drag reorder via the handle only (never interferes with status/edit taps).
// Move/up listeners live on document so both real touch and synthetic drags commit reliably.
function makeSortable(containerId,which){
  const cont=document.getElementById(containerId);
  cont.querySelectorAll('.drag').forEach(function(h){
    h.addEventListener('pointerdown',function(ev){
      ev.preventDefault();
      const row=h.closest('.plan'); if(!row)return;
      row.classList.add('dragging');
      function onMove(e){
        const others=[].slice.call(cont.querySelectorAll('.plan:not(.dragging)'));
        let ref=null;
        for(let i=0;i<others.length;i++){const rc=others[i].getBoundingClientRect();if(e.clientY<rc.top+rc.height/2){ref=others[i];break}}
        if(ref) cont.insertBefore(row,ref); else cont.appendChild(row);
      }
      function onUp(){
        document.removeEventListener('pointermove',onMove);
        document.removeEventListener('pointerup',onUp);
        document.removeEventListener('pointercancel',onUp);
        row.classList.remove('dragging');
        const order=[].slice.call(cont.querySelectorAll('.plan')).map(function(el){return el.dataset.id});
        const arr=state[which+'Plans'];
        arr.sort(function(a,b){return order.indexOf(a.id)-order.indexOf(b.id)});
        arr.forEach(function(p,i){p.position=i});
        const realIds=order.filter(function(x){return x&&!isTmp(x)});
        if(realIds.length) persist('reorderPlans',[realIds]);
      }
      document.addEventListener('pointermove',onMove);
      document.addEventListener('pointerup',onUp);
      document.addEventListener('pointercancel',onUp);
    });
  });
}

// reflection/review history (append-only, newest first)
function renderNotes(id, arr, mode, heading){
  const el=document.getElementById(id); if(!el) return;
  if(!arr||!arr.length){el.innerHTML='';return}
  // Each historical note is a native <details>, collapsed by default. Purely client-side —
  // opening/closing never calls the server. The full original text is always preserved.
  el.innerHTML=`<div class="notes-h">${heading}</div>`+arr.map(r=>
    `<details class="note"><summary>`+
    `<div class="note-hd"><span class="note-t">${stamp(r.created_at,mode)}</span><span class="chev">▸</span></div>`+
    `<div class="note-prev">${escapeHtml(preview(r.reflection))}</div>`+
    `</summary><div class="note-full">${escapeHtml(r.reflection)}</div></details>`
  ).join('');
}
function preview(t){const s=String(t||'').replace(/\s+/g,' ').trim();return s.length>72?s.slice(0,72)+'…':s}
function stamp(iso){const d=new Date(iso);if(isNaN(d.getTime()))return '';return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}

function listOf(id){return state.todayPlans.some(x=>x.id===id)?'today':'tomorrow'}
function findPlan(id){return state.todayPlans.find(x=>x.id===id)||state.tomorrowPlans.find(x=>x.id===id)}

// --- Optimistic mutations: update local state + UI immediately, persist in background ---
const CYCLE={planned:'done',done:'partial',partial:'skipped',skipped:'planned'};

function cycle(id,s){
  const next=CYCLE[s]||'planned';
  const p=findPlan(id); if(!p) return;
  p.status=next; p.updated_at=new Date().toISOString();
  const w=listOf(id); renderPlans(w+'Plans',state[w+'Plans']); updateCounts();
  if(!isTmp(id)) persist('setPlanStatus',[id,next],function(){p.status=s;renderPlans(w+'Plans',state[w+'Plans']);updateCounts()});
}

function add(which){
  const el=document.getElementById(which+'Input'),v=el.value.trim(); if(!v) return;
  const date=which==='today'?state.today:state.tomorrow, list=state[which+'Plans'];
  const tmpId='tmp_'+Date.now()+'_'+Math.floor(Math.random()*1e6), pos=list.length, nowIso=new Date().toISOString();
  const item={id:tmpId,date:date,plan:v,status:'planned',position:pos,created_at:nowIso,updated_at:nowIso};
  list.push(item); el.value=''; renderPlans(which+'Plans',list); updateCounts(); el.focus();
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){
    setBusy(false);
    const it=findPlan(tmpId);
    if(!it){ // deleted while pending -> remove the row we just created on the server
      google.script.run.withFailureHandler(function(){}).deletePlan(r.id); return;
    }
    it.id=r.id; it.created_at=r.created_at;
    // reconcile any changes made during the pending window
    if(it.status!=='planned') persist('setPlanStatus',[r.id,it.status]);
    if(it.plan!==r.plan) persist('updatePlan',[r.id,it.plan]);
    if(it.date!==r.date) persist('movePlan',[r.id,it.date,it.position]);
    renderPlans('todayPlans',state.todayPlans); renderPlans('tomorrowPlans',state.tomorrowPlans);
  }).withFailureHandler(function(e){
    setBusy(false);
    const i=list.findIndex(x=>x.id===tmpId); if(i>=0) list.splice(i,1);
    renderPlans(which+'Plans',list); updateCounts();
    el.value=v; toast('Add failed — text restored.');
  }).addPlan(date,v,pos);
}

function edit(id){
  const p=findPlan(id); if(!p) return;
  const v=prompt('Edit plan',p.plan); if(v===null) return;
  const t=v.trim(); if(!t) return;
  const prev=p.plan; p.plan=t; p.updated_at=new Date().toISOString();
  const w=listOf(id); renderPlans(w+'Plans',state[w+'Plans']);
  if(!isTmp(id)) persist('updatePlan',[id,t],function(){p.plan=prev;renderPlans(w+'Plans',state[w+'Plans'])});
}

function removePlan(id){
  if(!confirm('Remove this plan?')) return;
  const w=listOf(id), arr=state[w+'Plans'], idx=arr.findIndex(x=>x.id===id);
  if(idx<0) return;
  const removed=arr[idx];
  arr.splice(idx,1); renderPlans(w+'Plans',arr); updateCounts();
  if(!isTmp(id)) persist('deletePlan',[id],function(){arr.splice(idx,0,removed);renderPlans(w+'Plans',arr);updateCounts()});
}

// Move a plan between Today and Tomorrow (the two visible days).
function moveDay(id){
  const from=listOf(id), to=(from==='today')?'tomorrow':'today';
  const fromArr=state[from+'Plans'], idx=fromArr.findIndex(x=>x.id===id);
  if(idx<0) return;
  const item=fromArr.splice(idx,1)[0];
  item.date=state[to]; item.position=state[to+'Plans'].length;
  state[to+'Plans'].push(item);
  renderPlans(from+'Plans',state[from+'Plans']); renderPlans(to+'Plans',state[to+'Plans']); updateCounts();
  if(!isTmp(id)) persist('movePlan',[id,item.date,item.position]);
  toast('Moved to '+(to==='today'?'Today':'Tomorrow')+'.');
}
function saveReflection(){const ta=document.getElementById('reflection'),v=ta.value.trim();if(!v){toast('Nothing to save.');return}setBusy(true);google.script.run.withSuccessHandler(fin(r=>{ta.value='';if(r){state.reflections.unshift(r);renderNotes('todayNotes',state.reflections,'time',"Today's notes")}toast('Reflection saved.')})).withFailureHandler(fin(err)).saveReflection(state.today,v)}

// Review data loads only when the section is first opened (lazy).
function loadReview(){
  reviewLoaded=true;
  setBusy(true);google.script.run.withSuccessHandler(fin(renderWeek)).withFailureHandler(fin(err)).getWeeklySummary(null);
  setBusy(true);google.script.run.withSuccessHandler(fin(renderMonth)).withFailureHandler(fin(err)).getMonthlySummary(null);
}
function renderWeek(w){weekData=w;week=w.week;document.getElementById('weekRange').textContent=pretty(w.start)+' – '+pretty(w.end);document.getElementById('weekCounts').innerHTML=counts(w.counts);document.getElementById('weekReflection').value='';renderNotes('weekNotes',w.reflections,'date','Previous notes')}
function renderMonth(m){monthData=m;month=m.month;const d=new Date(m.month+'-01T00:00:00');document.getElementById('monthLabel').textContent=d.toLocaleDateString(undefined,{month:'long',year:'numeric'});document.getElementById('monthCounts').innerHTML=counts(m.counts);document.getElementById('monthReflection').value='';renderNotes('monthNotes',m.reflections,'date','Previous notes')}
function counts(c){return[['total','Plans'],['done','Done'],['partial','Partial'],['skipped','Skipped'],['moved','Moved']].map(([k,l])=>`<div><b>${c[k]||0}</b><span>${l}</span></div>`).join('')}
function saveWeekly(){const ta=document.getElementById('weekReflection'),v=ta.value.trim();if(!v){toast('Nothing to save.');return}setBusy(true);google.script.run.withSuccessHandler(fin(r=>{ta.value='';if(r&&weekData){weekData.reflections.unshift(r);renderNotes('weekNotes',weekData.reflections,'date','Previous notes')}toast('Weekly saved.')})).withFailureHandler(fin(err)).saveWeeklyReflection(week,v)}
function saveMonthly(){const ta=document.getElementById('monthReflection'),v=ta.value.trim();if(!v){toast('Nothing to save.');return}setBusy(true);google.script.run.withSuccessHandler(fin(r=>{ta.value='';if(r&&monthData){monthData.reflections.unshift(r);renderNotes('monthNotes',monthData.reflections,'date','Previous notes')}toast('Monthly saved.')})).withFailureHandler(fin(err)).saveMonthlyReflection(month,v)}

let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900)}

function exportData(){setBusy(true);google.script.run.withSuccessHandler(fin(data=>{download('PlanOS_Plans.csv',data.plans);download('PlanOS_Reflections.csv',data.reflections);download('PlanOS_WeeklyReviews.csv',data.weekly);download('PlanOS_MonthlyReviews.csv',data.monthly);toast('CSV exported.')})).withFailureHandler(fin(err)).exportCsv()}
function download(name,text){const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(text);a.download=name;a.click()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// Lazy-load Review the first time it is opened.
document.getElementById('review').addEventListener('toggle',function(){if(this.open&&!reviewLoaded)loadReview()});
load();
</script></body></html>
